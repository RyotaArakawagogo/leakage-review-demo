name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Same version as the local environment.
          python-version: "3.12.3"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: pytest
